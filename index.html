<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexander Carrels</title>
    <meta name="description" content="Alexander Carrels – software developer, engineer and photographer. An interactive 16-bit portfolio." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="plain/">Skip the game</a>
    <main class="stage">
      <canvas id="game" tabindex="0" role="application" aria-label="Portfolio game" aria-describedby="hint"></canvas>
      <p id="hint" class="hint" role="status"></p>
      <p id="film-rolls" class="film-rolls" aria-live="polite"></p>
      <div class="corner-controls">
        <nav class="fast-travel" aria-label="Fast-travel">
          <button type="button" class="fast-travel-toggle" aria-expanded="false" aria-controls="fast-travel-zones">Fast-travel</button>
          <ul id="fast-travel-zones" class="fast-travel-zones" hidden></ul>
        </nav>
        <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="false">
          Sound <span class="sound-toggle-state" aria-hidden="true">off</span>
        </button>
      </div>
      <div class="touch-controls">
        <div class="touch-controls-walk">
          <button type="button" class="touch-button" data-game-button="left" aria-label="Walk left">◀</button>
          <button type="button" class="touch-button" data-game-button="right" aria-label="Walk right">▶</button>
        </div>
        <div class="touch-controls-actions">
          <button type="button" class="touch-button touch-button-inventory" aria-label="Inventory">▤</button>
          <button type="button" class="touch-button touch-button-shutter" data-game-button="shutter" aria-label="Shutter">◉</button>
        </div>
      </div>
    </main>

    <dialog id="viewfinder" class="viewfinder" aria-labelledby="viewfinder-title" tabindex="-1">
      <article>
        <header>
          <h2 id="viewfinder-title"></h2>
          <p class="viewfinder-subtitle"></p>
          <p class="viewfinder-dates"></p>
        </header>
        <figure class="viewfinder-photos">
          <img class="viewfinder-photo" alt="" />
          <figcaption class="viewfinder-photo-nav">
            <button type="button" class="viewfinder-previous" aria-label="Previous photo">‹</button>
            <span class="viewfinder-photo-count" aria-live="polite"></span>
            <button type="button" class="viewfinder-next" aria-label="Next photo">›</button>
          </figcaption>
        </figure>
        <p class="viewfinder-body"></p>
        <ul class="viewfinder-links"></ul>
        <button type="button" class="viewfinder-close" aria-label="Close Viewfinder">×</button>
      </article>
    </dialog>

    <dialog id="inventory" class="viewfinder inventory" aria-labelledby="inventory-title" tabindex="-1">
      <article>
        <h2 id="inventory-title">Inventory</h2>
        <ul class="inventory-items"></ul>
        <button type="button" class="viewfinder-close inventory-close" aria-label="Close Inventory">×</button>
      </article>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
