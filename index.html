<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexander Carrels</title>
    <meta name="description" content="Alexander Carrels – software developer, engineer and photographer. An interactive 16-bit portfolio." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="plain/">Skip the game</a>
    <main class="stage">
      <canvas id="game" tabindex="0" role="application" aria-label="Portfolio game" aria-describedby="hint"></canvas>
      <p id="hint" class="hint" role="status"></p>
      <p id="film-rolls" class="film-rolls" aria-live="polite"></p>
      <div class="touch-controls">
        <div class="touch-controls-walk">
          <button type="button" class="touch-button" data-game-button="left" aria-label="Walk left">◀</button>
          <button type="button" class="touch-button" data-game-button="right" aria-label="Walk right">▶</button>
        </div>
        <button type="button" class="touch-button touch-button-shutter" data-game-button="shutter" aria-label="Shutter">◉</button>
      </div>
    </main>

    <dialog id="viewfinder" class="viewfinder" aria-labelledby="viewfinder-title" tabindex="-1">
      <article>
        <header>
          <h2 id="viewfinder-title"></h2>
          <p class="viewfinder-subtitle"></p>
          <p class="viewfinder-dates"></p>
        </header>
        <div class="viewfinder-photos"></div>
        <p class="viewfinder-body"></p>
        <ul class="viewfinder-links"></ul>
        <button type="button" class="viewfinder-close" aria-label="Close Viewfinder">×</button>
      </article>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
